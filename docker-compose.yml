version: '3.8'

services:
  postgres_db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  sync_worker:
    build: .
    container_name: sync_worker
    restart: always
    env_file:
      - .env
    depends_on:
      postgres_db:
        condition: service_healthy

  bot_server:
    build: ./bot_app
    container_name: bot_server
    restart: always
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      postgres_db:
        condition: service_healthy

  ngrok_tunnel:
    image: ngrok/ngrok:latest
    container_name: ngrok_tunnel
    restart: always
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command:
      - "http"
      - "--url=https://${NGROK_STATIC_DOMAIN}"
      - "--request-header-add=ngrok-skip-browser-warning:true"
      - "bot_server:8080"
    depends_on:
      - bot_server

volumes:
  pg_data: