name: Deploy Docker Containers to Office VPS

on:
  push:
    branches:
      - production  # Деплой тригериться ТІЛЬКИ при мерджі/пуші в production

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy cf-sync-pipeline
        run: |
          echo ">>> Оновлення продакшену на VPS..."
          TARGET_DIR="/home/vbrianka/cf-sync-pipeline"
          
          if [ -d "$TARGET_DIR" ]; then
            cd "$TARGET_DIR"
            
            # Перемикаємося на гілку production та затягуємо свіжий мердж
            git fetch origin production
            git checkout -f production
            git pull origin production
            
            # Перезбираємо та перезапускаємо оновлені контейнери
            docker compose up -d --build
            
            # Очищуємо старі невикористовувані образи
            docker image prune -f
            
            echo ">>> Деплой успішно завершено!"
          else
            echo "Помилка: директорія $TARGET_DIR не знайдена."
            exit 1
          fi

      # Тут можна додати деплой для інших ваших проєктів, які зберігатимуться в репозиторії:
      # - name: Deploy Another Project
      #   run: |
      #     cd /home/vbrianka/another-project
      #     docker compose up -d --build