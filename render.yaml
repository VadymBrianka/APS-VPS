services:
  - type: web
    name: cf-bot-server
    plan: free
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: ENABLE_SYNC_WORKER
        value: "true"
      - key: CF_AUTH_URL
        sync: false
      - key: CF_DATA_URL
        sync: false
      - key: CF_CLIENT_ID
        sync: false
      - key: CF_CLIENT_SECRET
        sync: false
      - key: CF_TOKEN_DURATION
        value: "60"
      - key: INITIAL_SINCE
        value: "2026-10-25T00:00:00Z"
      - key: SYNC_INTERVAL_SECONDS
        value: "300"
